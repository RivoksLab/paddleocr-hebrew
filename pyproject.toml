[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paddleocr-hebrew"
version = "0.1.0"
description = "Hebrew OCR — PaddleOCR/SVTRv2 recognizers + a runnable page pipeline (word-DET + script-gated CTC->NRTR cascade)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Rivok Labs" }]
keywords = ["ocr", "hebrew", "paddleocr", "svtrv2", "rtl", "onnx", "bidi"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "onnxruntime>=1.17",
    "pyclipper>=1.3",
    "Pillow>=10.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]

[project.urls]
Homepage = "https://github.com/RivoksLab/paddleocr-hebrew"
Models = "https://huggingface.co/Rivok/paddleocr-hebrew"

[tool.setuptools]
packages = ["paddleocr_hebrew"]
